name: CI Wandoor App Optimized

on:
  push:
    branches: ["ci/adam/setup-github-action"]
  pull_request:
    branches: ["ci/adam/setup-github-action"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        ports:
          - 1521:1521
        env:
          ORACLE_PASSWORD: password
        options: >-
          --health-cmd="echo 'select 1 from dual;' | sqlplus -s system/password@localhost:1521/XEPDB1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      # Build aplikasi (tanpa test)
      - name: Build with Gradle
        run: ./gradlew clean build -x test --no-daemon

      # Setup Docker buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ github.sha }}
          restore-keys: buildx-

      # Cache Trivy binary
      - name: Cache Trivy
        uses: actions/cache@v3
        with:
          path: ~/.cache/trivy
          key: trivy-binary-v0.56.1-Linux-X64
          restore-keys: trivy-binary-

      # Install Trivy
      - name: Setup Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh

      # Build local image first (for scanning)
      - name: Docker build (local)
        run: |
          docker build -t jrtr1/wandoor-backend-app:backend-${{ github.sha }} .

      # Scan vulnerability
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "jrtr1/wandoor-backend-app:backend-${{ github.sha }}"
          format: "table"
          exit-code: "0" # tidak block pipeline di staging
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          timeout: "10m0s"
          scanners: "vuln"

      # Start backend container for k6 testing
      - name: Run backend container
        run: |
          docker run -d --name backend-test -p 30080:8080 jrtr1/wandoor-backend-app:backend-${{ github.sha }}
          sleep 15

      - name: Check container status
        run: docker ps -a

      # Install k6
      - name: Install k6
        run: |
          sudo apt update
          sudo apt install -y k6

      # Run load test
      - name: Run k6 load test
        run: |
          k6 run k6/load-test.js

